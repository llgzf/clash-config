[custom]
; ==========================================================
; 最终优化版：影迷星球流媒体 + 谷歌心跳分流（台湾梦想盒子组）
; 电视盒子 + 飞牛 NAS 旁路由 / 彻底解决指纹闪退、注入 Fake-IP、关闭 IPv6
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; --- 1. 基础与网络通用设置 (统一端口、彻底关闭 IPv6) ---
mixed_port=7890
port=7890
socks_port=7891
allow_lan=true
ipv6=false
log_level=info

; --- 2. 彻底修复 TLS 指纹（global-client-fingerprint）导致的内核闪退 ---
global-client-fingerprint=null

; --- 3. DNS 模块注入 (针对旁路由环境，注入极速 Fake-IP 模式) ---
dns_enable=true
dns_ipv6=false
dns_enhanced_mode=fake-ip
dns_fake_ip_range=198.18.0.1/16
dns_use_hosts=true

; 排除列表：确保飞牛 NAS 本地服务、局域网设备、电视投屏（DLNA/AirPlay）绝不走 Fake-IP
dns_fake_ip_filter=*.lan,*.local,localhost,*.fnas,+.msftconnecttest.com,+.msftncsi.com

dns_default_nameserver=223.5.5.5,119.29.29.29,114.114.114.114
dns_nameserver=223.5.5.5,119.29.29.29,https://dns.alidns.com/dns-query,https://doh.pub/dns-query

; 节点域名解析器（必须为纯 IP）：Cloudflare 优选域名（cf.0sm.com、cf.090227.xyz 之类）
; 走这里解析。不填时 mihomo 会退到 nameserver/fallback 链，容易解析失败。
dns_proxy_server_nameserver=223.5.5.5,119.29.29.29,114.114.114.114

; fallback 默认留空：大陆访问不到 dns.google / 1.1.1.1 的 DoH，
; 一旦启用，境外 IP 的解析结果会被 fallback-filter 判为污染并强制改用 fallback，
; 结果就是 YouTube 打不开、节点域名报 "dns resolve failed: couldn't find ip"。
; 如果确实有可用的境外 DNS，再解开下面一行并同时配置 dns_fallback_geoip_code。
; dns_fallback=https://dns.google/dns-query,https://1.1.1.1/dns-query
dns_fallback=

; --- 4. 节点清洗 (排除无用节点和宣传广告) ---
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 5) 规则定义 (Rules) - 严格顺序：直连 > 分流 > 兜底
; ==========================================================

; --- 1. 局域网直连与旁路由穿透 (飞牛 NAS 本地高码率电影秒连，不卡顿) ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,lan,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve  ; 注入 Docker 容器默认网段
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 2. 核心视频与海外电视分流 ---
ruleset=🎬 视频与电视,[]DOMAIN-SUFFIX,886776.com
ruleset=🎬 视频与电视,[]DOMAIN-SUFFIX,886777.com
ruleset=🎬 视频与电视,[]DOMAIN-KEYWORD,littlecloud
ruleset=🎬 视频与电视,[]DOMAIN-KEYWORD,cloudtv
ruleset=🎬 视频与电视,[]DOMAIN-KEYWORD,youtube
ruleset=🎬 视频与电视,[]DOMAIN-KEYWORD,googlevideo
ruleset=🤖 ChatGPT,[]DOMAIN-KEYWORD,openai

; ==========================================================
; 【精准优化】影迷星球核心流媒体服务器与谷歌心跳分流
; 全部指向策略组：台湾梦想盒子
; ==========================================================
ruleset=台湾梦想盒子,[]DOMAIN-SUFFIX,vc1s.trasx.top
ruleset=台湾梦想盒子,[]DOMAIN-SUFFIX,no1x2.asiaw.top
ruleset=台湾梦想盒子,[]DOMAIN,1tv.gscdn.kbs.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,2tv.gscdn.kbs.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,hls-live.mbn.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,channelaid3.ichannela.com
ruleset=台湾梦想盒子,[]DOMAIN,live-global-cdn-v02.sooplive
ruleset=台湾梦想盒子,[]DOMAIN-KEYWORD,sooplive
ruleset=台湾梦想盒子,[]DOMAIN,onaircdn.tvchosun.com
ruleset=台湾梦想盒子,[]DOMAIN,onair2.cdn.tvchosun.com
ruleset=台湾梦想盒子,[]DOMAIN,vod3.obs.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,stream.chmbc.co.kr
ruleset=台湾梦想盒子,[]IP-CIDR,1.222.207.80/32,no-resolve
ruleset=台湾梦想盒子,[]DOMAIN,mediaworks.dema.mil.kr
ruleset=台湾梦想盒子,[]DOMAIN,cdntv.tbs.seoul.kr
ruleset=台湾梦想盒子,[]DOMAIN,media.joycorp.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,mgugaklive.nowcdn.co.kr
ruleset=台湾梦想盒子,[]IP-CIDR,61.82.49.4/32,no-resolve
ruleset=台湾梦想盒子,[]DOMAIN,bbstv.clouducs.com
ruleset=台湾梦想盒子,[]DOMAIN,btn.nowcdn.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,mcbs-live.cbs.co.kr
ruleset=台湾梦想盒子,[]DOMAIN,cdn-us-east-prod-ingest-infra-dacast-com.akamaized.net
ruleset=台湾梦想盒子,[]DOMAIN,play.googleapis.com
ruleset=台湾梦想盒子,[]DOMAIN,reminders-pa.googleapis.com
ruleset=台湾梦想盒子,[]DOMAIN,in.appcenter.ms
ruleset=台湾梦想盒子,[]DOMAIN,mtalk.google.com

; --- 3. 最终兜底 ---
ruleset=🚀 节点选择,[]GEOSITE,gfw
ruleset=🚀 节点选择,[]MATCH

; ==========================================================
; 6) 策略组定义 (精简无国界版，安全树状嵌套，防止 Loop)
; ==========================================================

; --- 【顶层总控制组】 ---
custom_proxy_group=🚀 节点选择`select`[]台湾梦想盒子`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT

; --- 【应用分流组】 ---
custom_proxy_group=🎬 视频与电视`select`[]台湾梦想盒子`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT
custom_proxy_group=🤖 ChatGPT`select`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT

; --- 【台湾梦想盒子专用组】影迷星球/韩国直播/谷歌心跳 ---
; 失效的“梦想盒子-自动测速”已删除；默认走 ♻️ 自动选择（全节点测速兜底），
; 也可选 🧭 手动选择 自己挑固定节点
custom_proxy_group=台湾梦想盒子`select`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT

; --- 【物理节点过滤与自动测速】 (精准匹配，排除组名套娃，不把策略组塞进节点列表) ---
custom_proxy_group=🧭 手动选择`select`^(?!.*(🚀|🎬|🤖|♻️|🧭|梦境盒子|梦想盒子|台湾梦想盒子|DIRECT|REJECT)).*
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*(🚀|🎬|🤖|♻️|🧭|梦境盒子|梦想盒子|台湾梦想盒子|DIRECT|REJECT)).*`http://www.gstatic.com/generate_204`1200,,100
