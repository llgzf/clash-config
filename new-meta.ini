[custom]
; ==========================================================
; 精准优化版：影迷星球核心流媒体 + 韩国电视台 + 谷歌心跳分流
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; 节点清洗
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 1) 规则定义 (Rules)
; ==========================================================

; --- 基础直连 (局域网与国内直连) ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,lan,no-resolve
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 【影迷星球与海外电视核心流媒体】 ---
ruleset=📺 海外电视,[]DOMAIN-SUFFIX,vc1s.trasx.top
ruleset=📺 海外电视,[]DOMAIN-SUFFIX,no1x2.asiaw.top
ruleset=📺 海外电视,[]DOMAIN-SUFFIX,886776.com
ruleset=📺 海外电视,[]DOMAIN-SUFFIX,886777.com
ruleset=📺 海外电视,[]DOMAIN,1tv.gscdn.kbs.co.kr
ruleset=📺 海外电视,[]DOMAIN,2tv.gscdn.kbs.co.kr
ruleset=📺 海外电视,[]DOMAIN,hls-live.mbn.co.kr
ruleset=📺 海外电视,[]DOMAIN,channelaid3.ichannela.com
ruleset=📺 海外电视,[]DOMAIN-KEYWORD,sooplive
ruleset=📺 海外电视,[]DOMAIN,onaircdn.tvchosun.com
ruleset=📺 海外电视,[]DOMAIN,onair2.cdn.tvchosun.com
ruleset=📺 海外电视,[]DOMAIN,vod3.obs.co.kr
ruleset=📺 海外电视,[]DOMAIN,stream.chmbc.co.kr
ruleset=📺 海外电视,[]IP-CIDR,1.222.207.80/32,no-resolve
ruleset=📺 海外电视,[]DOMAIN,mediaworks.dema.mil.kr
ruleset=📺 海外电视,[]DOMAIN,cdntv.tbs.seoul.kr
ruleset=📺 海外电视,[]DOMAIN,media.joycorp.co.kr
ruleset=📺 海外电视,[]DOMAIN,mgugaklive.nowcdn.co.kr
ruleset=📺 海外电视,[]IP-CIDR,61.82.49.4/32,no-resolve
ruleset=📺 海外电视,[]DOMAIN,bbstv.clouducs.com
ruleset=📺 海外电视,[]DOMAIN,btn.nowcdn.co.kr
ruleset=📺 海外电视,[]DOMAIN,mcbs-live.cbs.co.kr
ruleset=📺 海外电视,[]DOMAIN,cdn-us-east-prod-ingest-infra-dacast-com.akamaized.net

; --- 【谷歌心跳与框架服务】 ---
ruleset=🚀 节点选择,[]DOMAIN,play.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN,reminders-pa.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN,in.appcenter.ms
ruleset=🚀 节点选择,[]DOMAIN,mtalk.google.com

; --- 常用应用分流 ---
ruleset=🎬 YouTube,[]DOMAIN-KEYWORD,youtube
ruleset=🎬 YouTube,[]DOMAIN-KEYWORD,googlevideo
ruleset=🤖 ChatGPT,[]DOMAIN-KEYWORD,openai

; --- 兜底分流 ---
ruleset=🚀 节点选择,[]GEOSITE,gfw
ruleset=🚀 节点选择,[]FINAL

; ==========================================================
; 2) 策略组定义
; ==========================================================

; --- 【顶层总开关】 ---
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🧭 手动选择`[]📺 海外电视`[]🎬 YouTube`[]🤖 ChatGPT`[]DIRECT`[]🇰🇷 KR`[]🇭🇰 HK`[]🇹🇼 TW`[]🇺🇸 US

; --- 【中间分流组】 ---
; 海外电视优先分流到韩国与港台节点，避免锁区黑屏
custom_proxy_group=📺 海外电视`select`[]🇰🇷 KR`[]🇹🇼 TW`[]🇭🇰 HK`[]底层的全部节点`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇰🇷 KR`[]底层的全部节点`[]♻️ 自动选择
custom_proxy_group=🤖 ChatGPT`select`[]🇺🇸 US`[]🇸🇬 SG`[]底层的全部节点`[]DIRECT

; --- 【基础功能组】 ---
custom_proxy_group=🌐 Default`select`[]底层的全部节点`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]底层的全部节点`[]DIRECT

; --- 【物理节点集合】 ---
custom_proxy_group=底层的全部节点`select`[]♻️ 自动选择`[]🧭 手动选择`[]🇰🇷 KR`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US

; ==========================================================
; 3) 节点筛选与 HTTPS 测速
; ==========================================================
custom_proxy_group=🧭 手动选择`select`.*

; 全局 HTTPS 测速端点
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

custom_proxy_group=🇰🇷 KR`url-test`(?i)(🇰🇷|韩国|韓國|首尔|KR|Korea|KOR)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|HK|HongKong)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|TW|Taiwan|Taipei|Hinet)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|JP|Japan|Tokyo|Osaka)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|SG|Singapore)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|美國|US|United States|America)`https://cp.cloudflare.com/generate_204`300,,50
